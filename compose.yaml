services:
  maq_api:
    image: maq_api
    build:
      context: .
      dockerfile: MAQ_API/Dockerfile
    environment:
      Herepay__SecretKey: ${HEREPAY_SECRET_KEY}
      Herepay__ApiKey: ${HEREPAY_API_KEY}
      Herepay__PrivateKey: ${HEREPAY_PRIVATE_KEY}
      Herepay__CallbackUrl: ${HEREPAY_CALLBACK_URL}
      Herepay__RedirectUrl: ${HEREPAY_REDIRECT_URL}
  mysql:
    image: mysql:8.0
    container_name: maq_mysql
    environment:
      MYSQL_ROOT_PASSWORD: password123
      MYSQL_DATABASE: maq_db
    ports:
      - "3307:3306"

